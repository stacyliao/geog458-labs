<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>San Francisco Bay Vessel Movements — Lab 5 Flow Map</title>

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.js"></script>

  <script src="https://unpkg.com/deck.gl@^9.0.0/dist.min.js"></script>

  <style>
    body {
      margin: 0;
      font: 14px Arial, sans-serif;
      background: #101924;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    #panel {
      position: absolute;
      top: 16px;
      left: 16px;
      max-width: calc(100vw - 64px);
      width: 260px;
      padding: 16px;
      background: #172333;
      color: white;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      z-index: 10;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 19px;
    }

    p {
      color: #c0cfdd;
      font-size: 12px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 12px 0 6px;
    }

    select, button {
      padding: 8px;
      border: 1px solid #637487;
      border-radius: 4px;
      background: #26394f;
      color: white;
      font: inherit;
    }

    select {
      width: 100%;
    }

    button {
      cursor: pointer;
      margin-top: 12px;
      min-width: 90px;
    }

    button:hover {
      background: #36536e;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #c0cfdd;
    }

    #time-display {
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <!-- Map container -->
  <div id="map"></div>

  <!-- Map control panel -->
  <div id="panel">

    <h1>San Francisco Bay Vessel Movements</h1>

    <p>
        Animated vessel movements in San Francisco Bay,
        California, from July 16–17, 2025 (UTC).
        The clock below shows Seattle local time.
    </p>

    <p id="status" role="status">
      Loading AIS paths...
    </p>

    <!-- STEP 2A: Vessel-type dropdown -->
    <label for="vessel-type">Vessel type</label>

    <select id="vessel-type">
      <option value="passenger" selected>Passenger</option>
      <option value="tanker">Tanker</option>
      <option value="cargo">Cargo</option>
      <option value="other">Other vessels</option>
    </select>

    <!-- STEP 3A: Playback controls -->
    <button id="play-stop" type="button" aria-pressed="true">Stop</button>
    <p>Data time: <time id="time-display">Loading date/time...</time></p>
    <label for="time-slider">Data time (Seattle: PDT/PST)</label>
    <input id="time-slider" type="range" min="0" max="1" value="0" step="1" disabled
      style="display:block;width:100%;margin:8px 0;accent-color:#fd805d;">

  </div>

  <script>

    // -----------------------------------------
    // STEP 1: Create the map and load AIS data
    // -----------------------------------------

    mapboxgl.accessToken = 'pk.eyJ1Ijoic3RhY3lzdGFjeWxpYW9saWFvIiwiYSI6ImNtdXgwamo1eTAxeHYyenB2ZHZhdHBsbmwifQ.t4MQ8iJzIEjCks2VOP5tww';

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/dark-v11',
        center: [-122.43, 37.84],
        zoom: 9.7,
        pitch: 0
    });

    // Navigation controls
    map.addControl(new mapboxgl.NavigationControl());

    // deck.gl overlay
    const overlay = new deck.MapboxOverlay({
      layers: []
    });

    map.addControl(overlay);


    // -----------------------------------------
    // Main function
    // -----------------------------------------

    async function main() {

      const status = document.getElementById('status');

      // Load converted AIS JSON
      const response = await fetch('./ais_trips.json');

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const data = await response.json();

      // Keep vessel paths with at least 2 points
      const trips = data.filter(d => d.path.length >= 2);

      if (!trips.length) {
        throw new Error('No vessel paths found.');
      }

      let displayedTrips = trips;

      let playing = true;

      // Time range from AIS data
      const startTime = Math.min(
        ...trips.map(d => d.timestamps[0])
      );

      const endTime = Math.max(
        ...trips.map(d => d.timestamps.at(-1))
      ) + 3600;

      let currentTime = Math.min(
        startTime + 3600,
        endTime
      );

      let previousFrame = null;

      status.textContent =
        `${trips.length} paths loaded`;


      // -----------------------------------------
      // STEP 3B: Set up the Seattle date/time and slider
      // -----------------------------------------

      const metadataResponse = await fetch('./ais_trips_metadata.json');
      if (!metadataResponse.ok) throw new Error('Could not load ais_trips_metadata.json.');
      const metadata = await metadataResponse.json();
      const timeOrigin = Date.parse(metadata.time_origin_utc);
      if (!Number.isFinite(timeOrigin)) throw new Error('Invalid time_origin_utc in ais_trips_metadata.json.');
      const timeDisplay = document.getElementById('time-display');
      const timeSlider = document.getElementById('time-slider');
      timeSlider.min = String(startTime);
      timeSlider.max = String(endTime);
      timeSlider.disabled = false;

      const timeFormatter = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/Los_Angeles',
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hourCycle: 'h23', timeZoneName: 'short'
      });

      function updateTimeUI() {
        const date = new Date(timeOrigin + Math.floor(currentTime) * 1000);
        timeDisplay.dateTime = date.toISOString();
        timeDisplay.textContent = timeFormatter.format(date);
        timeSlider.value = String(Math.floor(currentTime));
        timeSlider.setAttribute('aria-valuetext', timeDisplay.textContent);
      }


      // -----------------------------------------
      // Draw animated vessel paths
      // -----------------------------------------

      function draw() {

        overlay.setProps({
          layers: [
            new deck.TripsLayer({

              id: 'ais-trips',

              data: displayedTrips,

              getPath: d => d.path,

              getTimestamps: d => d.timestamps,

              // Orange / coral vessel trails
              getColor: [253, 128, 93],

              widthMinPixels: 3,

              currentTime: currentTime,

              trailLength: 5400

            })
          ]
        });

        updateTimeUI();

      }


      // -----------------------------------------
      // STEP 2B: Vessel filtering logic
      // -----------------------------------------

      const vesselType =
        document.getElementById('vessel-type');

      function applyFilter() {

        displayedTrips = trips.filter(d => {

          const type = Number(d.type);

          // Passenger vessels: AIS 60–69
          if (vesselType.value === 'passenger') {
            return type >= 60 && type < 70;
          }

          // Tanker vessels: AIS 80–89
          if (vesselType.value === 'tanker') {
            return type >= 80 && type < 90;
          }

          // Cargo vessels: AIS 70–79
          if (vesselType.value === 'cargo') {
            return type >= 70 && type < 80;
          }

          // Other vessels: remaining AIS codes
          return !(type >= 60 && type < 90);

        });

        status.textContent =
          `${displayedTrips.length} paths selected`;

        draw();
      }

      // Update the map when dropdown changes
      vesselType.addEventListener(
        'change',
        applyFilter
      );

      // Apply Passenger filter by default
      applyFilter();


      // -----------------------------------------
      // STEP 3D: Play / Stop button and time slider
      // -----------------------------------------

      const playStop = document.getElementById('play-stop');

      function setPlaying(value) {
        playing = value;
        previousFrame = null;
        playStop.textContent = playing ? 'Stop' : 'Play';
        playStop.setAttribute('aria-pressed', String(playing));
      }

      playStop.addEventListener('click', () => setPlaying(!playing));

      timeSlider.addEventListener('input', () => {
        setPlaying(false);
        currentTime = Number(timeSlider.value);
        draw();
      });


      // -----------------------------------------
      // Animate vessel movements
      // -----------------------------------------

      // Advance data time by 10 minutes
      // per real second.

      function animate(now) {

        const elapsed =
          previousFrame === null
            ? 0
            : Math.min(
                (now - previousFrame) / 1000,
                0.2
              );

        previousFrame = now;

        if (playing) {

          currentTime += elapsed * 600;

          // Restart animation at end
          if (currentTime > endTime) {
            currentTime = startTime;
          }

          draw();

        }

        requestAnimationFrame(animate);
      }

      draw();

      requestAnimationFrame(animate);

    }

    main().catch(error => {

      document.getElementById('status').textContent =
        `Error: ${error.message}. Check your file path and local server.`;

      console.error(error);

    });

  </script>

</body>
</html>
