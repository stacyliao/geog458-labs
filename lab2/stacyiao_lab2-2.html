
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>World Cities Population Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Load Mapbox CSS and JavaScript -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>

    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

    /* Map title box */
    #title {
        position: absolute;
        top: 20px;
        left: 20px;
        background: white;
        padding: 15px 20px;
        border-radius: 5px;
        max-width: 300px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    /* Title text */
    #title h2 {
        margin: 0 0 8px 0;
        font-size: 20px;
        font-family: Arial, sans-serif;
    }

    /* Subtitle */
    #title p {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        font-family: Arial, sans-serif;
    }

    /* Population legend */
    #legend {
        position: absolute;
        bottom: 40px;
        right: 20px;
        width: 230px;
        background: white;
        padding: 18px;
        border-radius: 5px;
        font-family: Arial, sans-serif;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    /* Legend heading */
    #legend h3 {
        margin: 0 0 15px 0;
        font-size: 16px;
    }

    /* Each population category */
    .legend-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 12px;
        font-size: 13px;
    }

    /* Circle symbol */
    .legend-circle {
        display: inline-block;
        flex-shrink: 0;
        border-radius: 50%;
        opacity: 0.7;
        border: 0.5px solid white;
    }


    </style>
</head>

<body>
    <div id="map"></div>
    <div id="legend"></div>

    <div id="title">
        <h2>World Cities: Mapping the Megacities</h2>
        <p>Exploring global city populations, highlighting cities with 10 million or more residents.</p>
    </div>

    <script>
        mapboxgl.accessToken = 'pk.eyJ1Ijoic3RhY3lzdGFjeWxpYW9saWFvIiwiYSI6ImNtdXgwamo1eTAxeHYyenB2ZHZhdHBsbmwifQ.t4MQ8iJzIEjCks2VOP5tww';

        // Initialize
        const mymap = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/light-v11',
            center: [20, 20],
            zoom: 1.3
        });

        mymap.on('load', () => {

            mymap.addSource('population', {
                type: 'geojson',
                data: 'data/world-cities.geojson'
            });
     
            // This map uses four population classes to highlight megacities.
            // The class breaks are 100,000, 1 million, and 10 million.
            // Smaller cities use smaller, lighter blue circles, while
            // larger cities use bigger, darker blue circles.
            // Cities with 10 million or more people are highlighted in orange
            // to make global megacities stand out.
            // Circle sizes are graduated by class rather than proportional
            // to population area. All cities remain visible on the map.
            mymap.addLayer({
                id: 'population-layer',
                type: 'circle',
                source: 'population',
                
                paint: {
                    // Classify cities into four population groups.
                    // Larger cities receive larger circles.
                    'circle-radius': [
                        'step',
                        ['to-number', ['get', 'population'], 0],
                        2,
                        100000, 4,
                        1000000, 8,
                        10000000, 15
                    ],

                // Use increasingly darker blues for larger cities.
                // Orange highlights megacities with 10 million+ people.
                'circle-color': [
                    'step',
                    ['to-number', ['get', 'population'], 0],
                    '#90CAF9',
                    100000, '#42A5F5',
                    1000000, '#1565C0',
                    10000000, '#F57C00'
                ],

                'circle-opacity': 0.7,
                'circle-stroke-color': 'white',
                'circle-stroke-width': 0.5
            }

            });


            // Show city name and population when clicking a circle
            mymap.on('click', 'population-layer', (event) => {
                const feature = event.features[0];
                const coordinates = feature.geometry.coordinates.slice(0, 2);

                const city = feature.properties.accentcity;
                const population = feature.properties.population;

                new mapboxgl.Popup()
                    .setLngLat(coordinates)
                    .setHTML(
                        `<strong>${city}</strong>
                        <p>Population: ${Number(population).toLocaleString()}</p>`
                    )
                    .addTo(mymap);
            });

            // Change cursor to pointer when hovering over a city
            mymap.on('mouseenter', 'population-layer', () => {
                mymap.getCanvas().style.cursor = 'pointer';
            });

            // Restore cursor when leaving a city
            mymap.on('mouseleave', 'population-layer', () => {
                mymap.getCanvas().style.cursor = '';
            });

        });

        // Population legend
        const legend = document.getElementById('legend');

        const categories = [
            { label: 'Under 100,000', radius: 2, color: '#90CAF9' },
            { label: '100,000 - 999,999', radius: 4, color: '#42A5F5' },
            { label: '1 million - 9,999,999', radius: 8, color: '#1565C0' },
            { label: '10 million or more', radius: 15, color: '#F57C00' }
        ];

        let legendHTML = '<h3>City Population</h3>';

        categories.forEach(category => {
            const diameter = category.radius * 2;

            legendHTML += `
                <div class="legend-row">
                    <span class="legend-circle"
                        style="
                            width: ${diameter}px;
                            height: ${diameter}px;
                            background-color: ${category.color};
                        ">
                    </span>
                    <span>${category.label}</span>
                </div>
            `;
        });

        legendHTML += '<p style="font-size:11px; margin-bottom:0;">Source: Course-provided World Cities GeoJSON</p>';

        legend.innerHTML = legendHTML;

    </script>
</body>
</html>
